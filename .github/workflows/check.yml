name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make test check build acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: macbridge-go-universal
          path: |
            bin/macbridge
            MacBridge Go.app
